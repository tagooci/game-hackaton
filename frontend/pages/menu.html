<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выбор машины — Разъезд</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      font-family: "Montserrat", sans-serif;
      color: #000000;
      background: #F2E4D5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;

      --ink: #292B2B;
      --accent: #E9422B;
      --green: #79E33F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #F2E4D5;
    }

    button {
      font: inherit;
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.15fr);
      gap: clamp(24px, 5vw, 80px);
      padding: clamp(24px, 5vw, 72px);
    }

    .controls {
      width: min(100%, 456px);
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-title {
      min-height: 66px;
      display: flex;
      align-items: center;
      margin: 0 0 32px;
      padding: 10px 22px;
      border-radius: 14px;
      background: var(--ink);
      color: #FFFFFF;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.15;
      font-weight: 600;
    }

    .colors {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0;
      width: 100%;
      margin: 8px 0 56px;
      padding: 0;
    }

    .color-option {
      flex: 0 0 72px;
      position: relative;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 3px solid var(--ink);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 160ms ease;
    }

    .color-option:hover {
      transform: translateY(-3px);
    }

    .color-option:active {
      transform: scale(.92);
    }

    .color-option[aria-pressed="true"]::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #292B2B;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 1px 3px #FFFFFF;
    }

    .color-option:disabled {
      cursor: not-allowed;
      border-color: #888888;
      background: #666666 !important;
    }

    .color-option:disabled img {
      position: absolute;
      inset: 17px;
      width: 32px;
      height: 32px;
    }

    .color-option:focus-visible,
    .car-option:focus-visible,
    .go-button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    .cars-title {
      margin: 0 0 24px;
    }

    .car-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 164px));
      justify-content: space-between;
      gap: 24px;
      width: 100%;
    }

    .car-option {
      min-width: 0;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 3px solid transparent;
      border-radius: 16px;
      background: rgba(255,255,255,.38);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .car-option:hover {
      transform: translateY(-3px);
    }

    .car-option:active {
      transform: scale(.97);
    }

    .car-option[aria-pressed="true"] {
      border-color: var(--ink);
    }

    .car-option img {
      width: 100%;
      min-height: 0;
      flex: 1;
      object-fit: contain;
    }

    .car-option span {
      padding: 8px 4px 2px;
      color: #292B2B;
      text-align: center;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 600;
    }

    .preview-column {
      position: relative;
      min-width: 0;
      min-height: 560px;
      display: grid;
      place-items: center;
    }

    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    .go-button {
      position: absolute;
      right: 0;
      bottom: 0;
      z-index: 1;
      min-width: 230px;
      min-height: 100px;
      padding: 16px 24px;
      border: 0;
      border-radius: 16px;
      background: var(--green);
      color: #FFFFFF;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 600;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .go-button:hover {
      filter: brightness(1.04);
    }

    .go-button:active {
      transform: scale(.96);
    }

    .status {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 1;
      max-width: calc(100% - 260px);
      margin: 0;
      color: #555555;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .controls {
        margin: 0 auto;
      }

      .section-title {
        margin-bottom: 24px;
      }

      .colors {
        margin-bottom: 38px;
      }

      .preview-column {
        min-height: 430px;
      }

      .go-button {
        min-width: 180px;
        min-height: 76px;
      }
    }

    @media (max-width: 480px) {
      .layout {
        padding: 24px 18px;
      }

      .colors { gap: 8px; }

      .color-option {
        flex-basis: 48px;
        width: 48px;
        height: 48px;
      }

      .car-options { grid-template-columns: repeat(2, minmax(0, 140px)); gap: 14px; }
      .color-option:disabled img { width: 24px; height: 24px; inset: 9px; }

      .car-option span {
        font-size: 12px;
      }

      .preview-column {
        min-height: 340px;
      }

      .go-button {
        min-width: 150px;
        min-height: 64px;
        font-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
    .dialogue {
      position: absolute;
      top: 8px;
      left: 50%;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: min(100%, 540px);
      min-height: 126px;
      padding: 22px;
      transform: translateX(-50%);
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: #FFFFFF;
      color: #000000;
    }

    .dialogue__avatar {
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: #F2E4D5;
    }

    .dialogue__avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dialogue__text {
      min-width: 0;
      margin: 0;
      align-self: center;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    @media (max-width: 850px) {
      .preview-column { min-height: 530px; }
      #preview { top: 140px; height: calc(100% - 140px); }
      .dialogue { top: 0; }
    }

    @media (max-width: 480px) {
      .dialogue { gap: 12px; padding: 14px; }
      .dialogue__text { font-size: 14px; }
    }

  </style>
</head>

<body>
  <main class="layout">
    <section class="controls" aria-label="Настройки машины">
      <h1 class="section-title">Выбери цвет</h1>

      <div class="colors" role="group" aria-label="Цвет машины">
        <button
          class="color-option"
          type="button"
          data-color="#ff1717"
          aria-label="Красный"
          aria-pressed="true"
          style="background: #ff1717"
        ></button>

        <button
          class="color-option"
          type="button"
          data-color="#32f20b"
          aria-label="Зелёный"
          aria-pressed="false"
          style="background: #32f20b"
        ></button>

        <button
          class="color-option"
          type="button"
          data-color="#4775dc"
          aria-label="Синий"
          aria-pressed="false"
          style="background: #4775dc"
        ></button>

        <button
          class="color-option"
          type="button"
          data-color="#ffffff"
          aria-label="Белый"
          aria-pressed="false"
          style="background: #ffffff"
        ></button>

        <button
          class="color-option"
          type="button"
          disabled
          aria-label="Цвет закрыт"
          title="Цвет пока заблокирован"
        >
          <img src="./assets/lock.svg" alt="">
        </button>
      </div>

      <h2 class="section-title cars-title">Выбери машину</h2>

      <div class="car-options" role="group" aria-label="Модель машины">
        <button
          class="car-option"
          type="button"
          data-model="sedan"
          aria-pressed="true"
        >
          <img src="./assets/sedan.png" alt="Красный седан">
          <span>Основной седан</span>
        </button>

        <button
          class="car-option"
          type="button"
          data-model="sports"
          aria-pressed="false"
        >
          <img src="./assets/sedan-sports.png" alt="Красный спортивный седан">
          <span>Спортивная</span>
        </button>
      </div>
    </section>

    <section class="preview-column" aria-label="3D-превью">
      <aside class="dialogue" aria-label="Реплика говорящего">
        <div class="dialogue__avatar" aria-hidden="true">
          <img src="./assets/officer-avatar-v2.svg" alt="">
        </div>
        <p class="dialogue__text" id="dialogue-text" aria-live="polite">Готов к поездке? Выбери машину и цвет!</p>
      </aside>
      <canvas id="preview" aria-label="Предпросмотр машины на дороге"></canvas>
      <p class="status" id="status" aria-live="polite">Загрузка 3D-превью…</p>
      <button class="go-button" type="button">Поехали!</button>
    </section>
  </main>

  <script type="module">
  import "@babylonjs/loaders/glTF/2.0/glTFLoader.js";
  import { Engine } from "@babylonjs/core/Engines/engine.js";
  import { Scene } from "@babylonjs/core/scene.js";
  import { ArcRotateCamera } from "@babylonjs/core/Cameras/arcRotateCamera.js";
  import { HemisphericLight } from "@babylonjs/core/Lights/hemisphericLight.js";
  import { DirectionalLight } from "@babylonjs/core/Lights/directionalLight.js";
  import { Vector3 } from "@babylonjs/core/Maths/math.vector.js";
  import { Color3, Color4 } from "@babylonjs/core/Maths/math.color.js";
  import { Texture } from "@babylonjs/core/Materials/Textures/texture.js";
  import { TransformNode } from "@babylonjs/core/Meshes/transformNode.js";
  import { MeshBuilder } from "@babylonjs/core/Meshes/meshBuilder.js";
  import { StandardMaterial } from "@babylonjs/core/Materials/standardMaterial.js";
  import { LoadAssetContainerAsync } from "@babylonjs/core/Loading/sceneLoader.js";

  const canvas = document.querySelector("#preview");
  const status = document.querySelector("#status");

  const engine = new Engine(canvas, true, {
    preserveDrawingBuffer: true,
    stencil: true
  });

  const scene = new Scene(engine);
  scene.clearColor = new Color4(242/255, 228/255, 213/255, 1);

  const camera = new ArcRotateCamera(
    "preview-camera",
    -Math.PI / 2.2,
    Math.PI / 2.8,
    8,
    new Vector3(0, 0.8, 0),
    scene
  );
  camera.lowerRadiusLimit = 5;
  camera.upperRadiusLimit = 12;
  camera.attachControl(canvas, true);

  const hemi = new HemisphericLight(
    "preview-hemi",
    new Vector3(0, 1, 0),
    scene
  );
  hemi.intensity = 0.9;

  const keyLight = new DirectionalLight(
    "preview-key",
    new Vector3(-1, -2, 1),
    scene
  );
  keyLight.position = new Vector3(4, 8, -4);
  keyLight.intensity = 1.2;

  const paintColors = {
    "#ff1717": new Color3(1, 0.09, 0.09),
    "#32f20b": new Color3(0.2, 0.95, 0.05),
    "#4775dc": new Color3(0.28, 0.46, 0.86),
    "#ffffff": new Color3(0.95, 0.95, 0.95)
  };

  let selectedColor = "#ff1717";
  let modelRoot = null;
  let currentContainer = null;
  let loadId = 0;

  function showError(message, error) {
    console.error(message, error);
    status.textContent = message;
  }

  function createFallbackRoad() {
    const material = new StandardMaterial("road-fallback-material", scene);
    material.diffuseColor = new Color3(0.16, 0.17, 0.17);

    const road = MeshBuilder.CreateGround(
      "road-fallback",
      { width: 4.2, height: 4.6 },
      scene
    );

    road.position.y = -0.06;
    road.material = material;
  }

  async function loadRoad() {
    try {
      const road = await LoadAssetContainerAsync(
        "./assets/models/road/road-straight.glb",
        scene,
        { pluginExtension: ".glb" }
      );

      road.addAllToScene();

      const roadRoot = new TransformNode("road-root", scene);
      for (const node of road.rootNodes) {
        node.parent = roadRoot;
      }

      const { min, max } = roadRoot.getHierarchyBoundingVectors(true);
      const sx = 4.2 / (max.x - min.x);
      const sz = 4.6 / (max.z - min.z);
      roadRoot.scaling.set(sx, 1, sz);
      roadRoot.position.set(-(min.x + max.x) * sx / 2, -max.y - 0.015, -(min.z + max.z) * sz / 2);
    } catch (error) {
      showError("Дорога не загрузилась; показываю временную площадку.", error);
      createFallbackRoad();
    }
  }

  const paintFiles = { "#ff1717": "red", "#32f20b": "green", "#4775dc": "blue", "#ffffff": "white" };
  const paintTextures = Object.fromEntries(Object.entries(paintFiles).map(([hex, name]) => [
    hex, new Texture(`./assets/paint/${name}.png`, scene, false, false, Texture.NEAREST_SAMPLINGMODE)
  ]));

  function recolorVehicle(root) {
    for (const mesh of root.getChildMeshes()) {
      // Body and spoiler contain the paint swatch; other palette cells stay intact.
      if (!/-(body|spoiler)$/.test(mesh.name) || !mesh.material) continue;
      if (!mesh.metadata?.previewPaint) {
        mesh.material = mesh.material.clone(`${mesh.name}-paint`);
        mesh.metadata = { ...mesh.metadata, previewPaint: true };
      }
      mesh.material.albedoColor = Color3.White();
      mesh.material.albedoTexture = paintTextures[selectedColor];
    }
  }

  async function loadVehicle(model) {
    const thisLoad = ++loadId;
    status.textContent = "Загружаю машину…";

    modelRoot?.dispose();
    modelRoot = null;
    currentContainer?.dispose();
    currentContainer = null;

    const url = model === "sedan"
      ? "./assets/models/sedan/model.glb"
      : "./assets/models/sedan-sports/model.glb";

    try {
      const container = await LoadAssetContainerAsync(
        url,
        scene,
        { pluginExtension: ".glb" }
      );

      if (thisLoad !== loadId) {
        container.dispose();
        return;
      }

      currentContainer = container;

      const instance = container.instantiateModelsToScene(
        name => `preview-${name}`, true, { doNotInstantiate: true }
      );

      modelRoot = new TransformNode("preview-car-root", scene);

      const centeredModel = new TransformNode("centered-model", scene);
      for (const node of instance.rootNodes) node.parent = centeredModel;
      const bounds = centeredModel.getHierarchyBoundingVectors(true);
      const size = bounds.max.subtract(bounds.min);
      const largest = Math.max(size.x, size.y, size.z);

      if (!Number.isFinite(largest) || largest <= 0) {
        throw new Error("У модели не получилось определить размеры.");
      }

      const scale = 3.4 / largest;
      centeredModel.scaling.setAll(scale);
      centeredModel.position.set(-(bounds.min.x + bounds.max.x) * scale / 2, -bounds.min.y * scale, -(bounds.min.z + bounds.max.z) * scale / 2);
      centeredModel.parent = modelRoot;
      modelRoot.rotation.y = Math.PI;

      recolorVehicle(modelRoot);

      status.textContent = "";
    } catch (error) {
      showError(`Не загрузилась модель: ${url}`, error);
    }
  }

  document.querySelectorAll(".color-option:not(:disabled)").forEach(button => {
    button.addEventListener("click", () => {
      selectedColor = button.dataset.color;

      document.querySelectorAll(".color-option:not(:disabled)").forEach(option => {
        option.setAttribute("aria-pressed", String(option === button));
      });

      if (modelRoot) recolorVehicle(modelRoot);
    });
  });

  document.querySelectorAll(".car-option").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".car-option").forEach(option => {
        option.setAttribute("aria-pressed", String(option === button));
      });

      loadVehicle(button.dataset.model);
    });
  });

  document.querySelector(".go-button").addEventListener("click", () => {
    // Запуск игры можно подключить позже.
  });

  scene.onBeforeRenderObservable.add(() => {
    if (modelRoot) {
      modelRoot.rotation.y += engine.getDeltaTime() * 0.00012;
    }
  });

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());

  await loadRoad();
  await loadVehicle("sedan");

  window.addEventListener("beforeunload", () => {
    scene.dispose();
    engine.dispose();
  });
</script>
</body>
</html>
